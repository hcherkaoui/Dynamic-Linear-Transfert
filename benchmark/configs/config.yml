plotting:
  figures_dir: "_figures"             # Output directory for plots
  fontsize: 18                        # Base font size for plots
  lw: 3.5                             # Line width for curves
  alpha: 0.6                          # Alpha for uncertainty bands
  markersize: 10                      # Marker size for points

launcher:
  n_jobs: 25                          # Number of parallel jobs
  n_runs: 250                         # Number of Monte Carlo runs
  joblib_verbose: 10                  # Joblib verbosity level
  seed: 4578902                       # Global RNG seed
  # l_datasets: [email, boston]       # Previous real datasets
  l_datasets: [lipophilicity_chemberta, aqsoldb_chemberta]  # Real embedding datasets
  l_eps_classif_mono: [8, 4, 0.2, 0]  # Classif mono-source eps values
  l_eps_classif_multi: [10, 20]       # Classif multi-sources eps values
  l_eps_regr_mono: [1, 0.8, 0.2, 0]   # Regr mono-source eps values
  l_eps_regr_multi: [1, 5]            # Regr multi-sources eps values

model:
  alpha: 0.01                        # LCB parameter

bench:
  chunk_size: 10                      # Chunk size for dynamic augmentation
  start_plot: 1                       # Plot starting index for stability

data:
  l_eps:
    start: -3                         # log10(eps) start
    stop: 3                           # log10(eps) stop
    num: 10                           # Number of points
  l_sigma_s:
    start: -3                         # log10(sigma_s) start
    stop: 3                           # log10(sigma_s) stop
    num: 10                           # Number of points
  n_t: 10000                          # Target train size
  n_s: 10000                          # Source size per dataset
  n_points: 10                        # Number of sample sizes in curves
  sigma: 1.0                          # Noise level
  d: 50                               # Feature dimension
  standardize_real: true              # Standardize features for real datasets
  lbda_default: 1.0                   # Default ridge regularization
